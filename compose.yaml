services:
  nexus-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-core:latest
    container_name: nexus-core
    restart: unless-stopped
    ports:
      - "${NEXUS_CORE_PORT:-4040}:4040"
    env_file:
      - .env
    environment:
      - NEXUS_CORE_PORT=4040
      - NEXUS_CORE_HOST=0.0.0.0
      - NEXUS_CORE_AUTH_TOKENS=${NEXUS_CORE_AUTH_TOKENS:-nexus-dev-secret-token}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID:-}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID:-}
    volumes:
      - nexus-core-data:/home/node/.nexus
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4040/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  nexus-core-data:
    name: nexus-core-data
